<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Rushabh Medical Agencies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="bg-gray-100">
    <header class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-900">Admin Dashboard</h1>
            <button id="logout-btn" class="text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg px-4 py-2">Logout</button>
        </div>
    </header>
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-8">
                <div class="bg-white rounded-2xl shadow-lg p-6">
                    <h2 class="text-xl font-semibold mb-4">Manage Employees</h2>
                    <form id="add-employee-form" class="space-y-4">
                        <div>
                            <label for="new-employee-id" class="block text-sm font-medium text-gray-700">New Employee ID</label>
                            <input type="text" id="new-employee-id" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
                        </div>
                        <div>
                            <label for="new-employee-password" class="block text-sm font-medium text-gray-700">Set Password</label>
                            <input type="password" id="new-employee-password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700">Add Employee</button>
                    </form>
                    <div class="mt-6">
                        <h3 class="text-lg font-medium">Current Employees</h3>
                        <ul id="employee-list" class="mt-2 space-y-2 max-h-40 overflow-y-auto custom-scrollbar pr-2"></ul>
                    </div>
                </div>
                <div class="bg-white rounded-2xl shadow-lg p-6">
                    <h2 class="text-xl font-semibold mb-4">Assign Task</h2>
                    <form id="assign-task-form" class="space-y-4">
                        <div>
                            <label for="task-employee-select" class="block text-sm font-medium text-gray-700">Assign to</label>
                            <select id="task-employee-select" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md"></select>
                        </div>
                        <div>
                            <label for="task-description" class="block text-sm font-medium text-gray-700">Task Description</label>
                            <textarea id="task-description" rows="3" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required></textarea>
                        </div>
                        <div>
                            <label for="task-instructions" class="block text-sm font-medium text-gray-700">Instructions (Optional)</label>
                            <textarea id="task-instructions" rows="2" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"></textarea>
                        </div>
                        <div>
                            <label for="task-link" class="block text-sm font-medium text-gray-700">Google Maps Link</label>
                            <input type="url" id="task-link" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required placeholder="https://maps.app.goo.gl/...">
                        </div>
                        <div>
                            <label for="task-schedule" class="block text-sm font-medium text-gray-700">Schedule for</label>
                            <select id="task-schedule" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md">
                                <option>Unscheduled</option>
                                <option>Monday</option>
                                <option>Tuesday</option>
                                <option>Wednesday</option>
                                <option>Thursday</option>
                                <option>Friday</option>
                                <option>Saturday</option>
                                <option>Sunday</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700">Assign Task</button>
                    </form>
                </div>
            </div>
            <div class="lg:col-span-2 bg-white rounded-2xl shadow-lg p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">Task Overview</h2>
                    <button id="reset-tasks-btn" class="text-sm font-medium text-white bg-orange-600 hover:bg-orange-700 rounded-lg px-4 py-2">Reset All Statuses</button>
                </div>
                <div id="task-list" class="space-y-4 max-h-[70vh] overflow-y-auto custom-scrollbar pr-2"></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, deleteDoc, query, where, getDocs, writeBatch, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') {
            window.location.href = './index.html';
        }

        const firebaseConfig = {
            apiKey: "AIzaSyADR9eysXPBY-mGsT2MUBbsKBkcYgLH66I",
            authDomain: "rushabh-medical-task.firebaseapp.com",
            projectId: "rushabh-medical-task",
            storageBucket: "rushabh-medical-task.appspot.com",
            messagingSenderId: "627857793589",
            appId: "1:627857793589:web:b7f780679f2f2c9500077c",
            measurementId: "G-BX7X3ERMQ0"
        };
        
        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            const auth = getAuth(app);
            await signInAnonymously(auth);
        } catch (e) {
            console.error("Firebase initialization failed:", e);
            alert("Could not connect to the database.");
        }

        const logoutBtn = document.getElementById('logout-btn');
        const addEmployeeForm = document.getElementById('add-employee-form');
        const newEmployeeIdInput = document.getElementById('new-employee-id');
        const newEmployeePasswordInput = document.getElementById('new-employee-password');
        const employeeList = document.getElementById('employee-list');
        const taskEmployeeSelect = document.getElementById('task-employee-select');
        const assignTaskForm = document.getElementById('assign-task-form');
        const taskList = document.getElementById('task-list');
        const resetTasksBtn = document.getElementById('reset-tasks-btn');

        const employeesRef = collection(db, "employees");
        const tasksRef = collection(db, "tasks");

        onSnapshot(employeesRef, (snapshot) => {
            employeeList.innerHTML = '';
            taskEmployeeSelect.innerHTML = '';
            if (snapshot.empty) {
                employeeList.innerHTML = '<li class="text-gray-500 text-sm">No employees added yet.</li>';
                taskEmployeeSelect.innerHTML = '<option disabled>Please add an employee first</option>';
                return;
            }
            snapshot.docs.forEach(doc => {
                const emp = doc.data();
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-gray-50 p-2 rounded-md';
                li.innerHTML = `<span class="font-medium">${emp.id}</span><button data-id="${doc.id}" data-employee-id="${emp.id}" class="delete-employee-btn text-red-500 hover:text-red-700 font-semibold">Delete</button>`;
                employeeList.appendChild(li);

                const option = document.createElement('option');
                option.value = emp.id;
                option.textContent = emp.id;
                taskEmployeeSelect.appendChild(option);
            });
        });

        onSnapshot(tasksRef, (snapshot) => {
            taskList.innerHTML = '';
            if (snapshot.empty) {
                taskList.innerHTML = '<p class="text-gray-500 text-center">No tasks assigned.</p>';
            } else {
                snapshot.docs.forEach(doc => {
                    const task = doc.data();
                    const isCompleted = task.status === 'Completed';
                    const taskCard = document.createElement('div');
                    taskCard.className = `bg-gray-50 p-4 rounded-lg border ${isCompleted ? 'border-green-300' : 'border-gray-200'}`;
                    
                    let scheduledTimeHTML = '';
                    if (task.scheduledAt && task.scheduledAt !== 'Unscheduled') {
                        const scheduledDay = task.scheduledAt;
                        scheduledTimeHTML = `
                        <div class="mt-2">
                             <p class="text-xs font-semibold text-gray-500">SCHEDULED FOR: ${scheduledDay}</p>
                        </div>`;
                    }

                    let instructionsHTML = '';
                    if (task.instructions) {
                        instructionsHTML = `
                        <div class="mt-2 border-t pt-2">
                            <p class="text-sm font-semibold text-gray-600">Instructions:</p>
                            <p class="text-sm text-gray-800">${task.instructions}</p>
                        </div>
                        `;
                    }

                    taskCard.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="font-bold text-blue-600">${task.employeeId}</p>
                                <p class="mt-1 text-gray-800">${task.description}</p>
                            </div>
                            <button data-id="${doc.id}" class="delete-task-btn text-sm text-red-500 hover:text-red-700 font-semibold">Remove</button>
                        </div>
                        ${instructionsHTML}
                        ${scheduledTimeHTML}
                        <div class="mt-3 flex justify-between items-center">
                            <a href="${task.link}" target="_blank" rel="noopener noreferrer" class="text-sm text-green-600 hover:underline">
                                View Location &#8599;
                            </a>
                            <span class="text-xs font-bold uppercase px-2 py-1 rounded-full ${isCompleted ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                                ${task.status || 'Pending'}
                            </span>
                        </div>
                        <div class="mt-3 border-t pt-2 ${task.feedback ? '' : 'hidden'}">
                            <p class="text-sm font-semibold text-gray-600">Feedback:</p>
                            <p class="text-sm text-gray-800 italic">"${task.feedback}"</p>
                        </div>
                    `;
                    taskList.appendChild(taskCard);
                });
            }
        });

        addEmployeeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newId = newEmployeeIdInput.value.trim();
            const newPassword = newEmployeePasswordInput.value.trim();
            if (!newId || !newPassword) return;
            const q = query(employeesRef, where("id", "==", newId));
            const querySnapshot = await getDocs(q);
            if (!querySnapshot.empty) {
                alert('An employee with this ID already exists.');
                return;
            }
            await addDoc(employeesRef, { id: newId, password: newPassword });
            addEmployeeForm.reset();
        });

        employeeList.addEventListener('click', async (e) => {
            if (e.target.classList.contains('delete-employee-btn')) {
                if (!confirm("Delete this employee and ALL their tasks? This cannot be undone.")) return;
                const docId = e.target.dataset.id;
                const employeeId = e.target.dataset.employeeId;
                await deleteDoc(doc(db, "employees", docId));
                const tasksQuery = query(tasksRef, where("employeeId", "==", employeeId));
                const tasksSnapshot = await getDocs(tasksQuery);
                const batch = writeBatch(db);
                tasksSnapshot.forEach(doc => { batch.delete(doc.ref); });
                await batch.commit();
            }
        });

        assignTaskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const employeeId = taskEmployeeSelect.value;
            const description = document.getElementById('task-description').value.trim();
            const instructions = document.getElementById('task-instructions').value.trim();
            const link = document.getElementById('task-link').value.trim();
            const scheduledAt = document.getElementById('task-schedule').value;

            if (employeeId && description && link) {
                await addDoc(tasksRef, { 
                    employeeId, 
                    description, 
                    instructions: instructions || '',
                    link,
                    scheduledAt: scheduledAt,
                    status: 'Pending',
                    feedback: ''
                });
                assignTaskForm.reset();
            } else {
                alert('Please select an employee and fill out all required task fields.');
            }
        });
        
        taskList.addEventListener('click', async (e) => {
            if (e.target.classList.contains('delete-task-btn')) {
                const docId = e.target.dataset.id;
                await deleteDoc(doc(db, "tasks", docId));
            }
        });

        resetTasksBtn.addEventListener('click', async () => {
            if (!confirm("Are you sure you want to reset the status of ALL tasks to 'Pending'?")) {
                return;
            }
            try {
                const tasksSnapshot = await getDocs(tasksRef);
                const batch = writeBatch(db);
                tasksSnapshot.forEach(doc => {
                    batch.update(doc.ref, { status: 'Pending' });
                });
                await batch.commit();
                alert("All task statuses have been reset to Pending.");
            } catch (error) {
                console.error("Error resetting task statuses: ", error);
                alert("Could not reset task statuses. Please try again.");
            }
        });

        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('isAdminLoggedIn');
            window.location.href = './index.html';
        });
    </script>
</body>
</html>
