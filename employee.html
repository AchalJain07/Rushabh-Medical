<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard - Rushabh Medical Agencies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-100">
    <!-- Header -->
    <header class="bg-white shadow-md">
        <div class="max-w-4xl mx-auto py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-900">Your Assigned Tasks</h1>
            <button id="logout-btn" class="text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg px-4 py-2">Logout</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto py-6 sm:px-6 lg:px-8">
        <div class="px-4 py-6 sm:px-0">
            <!-- Welcome Message -->
            <h2 id="welcome-message" class="text-xl font-semibold mb-6 text-center text-gray-700"></h2>
            
            <!-- Task List Container -->
            <div id="employee-task-list" class="space-y-4">
                <!-- Tasks will be dynamically inserted here -->
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const loggedInEmployeeId = sessionStorage.getItem('loggedInEmployeeId');
        if (!loggedInEmployeeId) {
            window.location.href = './index.html';
        }

        const firebaseConfig = {
            apiKey: "AIzaSyADR9eysXPBY-mGsT2MUBbsKBkcYgLH66I",
            authDomain: "rushabh-medical-task.firebaseapp.com",
            projectId: "rushabh-medical-task",
            storageBucket: "rushabh-medical-task.appspot.com",
            messagingSenderId: "627857793589",
            appId: "1:627857793589:web:b7f780679f2f2c9500077c",
            measurementId: "G-BX7X3ERMQ0"
        };
        
        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            const auth = getAuth(app);
            await signInAnonymously(auth);
        } catch (e) {
            console.error("Firebase initialization failed:", e);
            alert("Could not connect to the database.");
        }

        const taskListContainer = document.getElementById('employee-task-list');
        const logoutBtn = document.getElementById('logout-btn');
        const welcomeMessage = document.getElementById('welcome-message');
        
        welcomeMessage.textContent = `Welcome, ${loggedInEmployeeId}!`;

        const tasksRef = collection(db, "tasks");
        const q = query(tasksRef, where("employeeId", "==", loggedInEmployeeId));

        onSnapshot(q, (snapshot) => {
            taskListContainer.innerHTML = '';
            
            if (snapshot.empty) {
                taskListContainer.innerHTML = '<p class="text-center text-gray-500">You have no tasks assigned to you.</p>';
            } else {
                snapshot.docs.forEach(doc => {
                    const task = doc.data();
                    const taskCard = document.createElement('div');
                    taskCard.className = 'bg-white shadow-lg rounded-xl p-6 border';

                    let instructionsHTML = '';
                    if (task.instructions) {
                        instructionsHTML = `
                        <div class="mt-4 border-t pt-4">
                            <h4 class="text-sm font-semibold text-gray-700">Instructions:</h4>
                            <p class="text-sm text-gray-800 mt-1 whitespace-pre-wrap">${task.instructions}</p>
                        </div>
                        `;
                    }

                    taskCard.innerHTML = `
                        <div class="flex justify-between items-center">
                            <h3 class="text-lg font-semibold text-gray-800">${task.description}</h3>
                            <div class="flex items-center space-x-2">
                                <select data-id="${doc.id}" class="status-select text-sm rounded-md border-gray-300 focus:ring-blue-500 focus:border-blue-500">
                                    <option value="Pending" ${task.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                    <option value="Completed" ${task.status === 'Completed' ? 'selected' : ''}>Completed</option>
                                </select>
                            </div>
                        </div>
                        <a href="${task.link}" target="_blank" rel="noopener noreferrer" class="mt-3 inline-block text-sm font-medium text-blue-600 hover:text-blue-800">
                            Open Google Maps Link &rarr;
                        </a>
                        ${instructionsHTML}
                        <div class="mt-4 border-t pt-4">
                            <label for="feedback-${doc.id}" class="text-sm font-medium text-gray-700">Add Feedback:</label>
                            <textarea id="feedback-${doc.id}" rows="2" class="mt-1 block w-full text-sm border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">${task.feedback || ''}</textarea>
                            <button data-id="${doc.id}" class="save-feedback-btn mt-2 text-sm font-medium text-white bg-green-600 hover:bg-green-700 rounded-lg px-3 py-1">Save Feedback</button>
                        </div>
                    `;
                    taskListContainer.appendChild(taskCard);
                });
            }
        });
        
        taskListContainer.addEventListener('change', async (e) => {
            if (e.target.classList.contains('status-select')) {
                const docId = e.target.dataset.id;
                const newStatus = e.target.value;
                const taskDocRef = doc(db, 'tasks', docId);
                await updateDoc(taskDocRef, { status: newStatus });
            }
        });

        taskListContainer.addEventListener('click', async (e) => {
            if (e.target.classList.contains('save-feedback-btn')) {
                const docId = e.target.dataset.id;
                const feedbackText = document.getElementById(`feedback-${docId}`).value.trim();
                const taskDocRef = doc(db, 'tasks', docId);
                await updateDoc(taskDocRef, { feedback: feedbackText });
                alert('Feedback saved!');
            }
        });
        
        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem('loggedInEmployeeId');
            window.location.href = './index.html';
        });
    </script>
</body>
</html>
